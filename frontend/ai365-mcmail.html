    body = `<div class="invdoc"><div style="display:flex;align-items:flex-start;gap:12px"><img src="${LOGO_FULL}" alt="M Cosmetic" style="width:120px"><div style="margin-left:auto;text-align:right"><div style="font-size:20px;font-weight:600;letter-spacing:.04em">INVOICE</div><div class="mono">${r.invoiceNo}</div><div class="muted num">발행일 ${today()}</div></div></div>
      <dl class="dl" style="margin:18px 0"><dt>Bill To</dt><dd>${esc(r.customer)} <span class="mono muted">${r.customerCode}</span></dd><dt>Address</dt><dd>${esc(r.billTo || '-')}</dd><dt>Sales Order</dt><dd class="mono">${r.so}</dd><dt>Order Date</dt><dd class="num">${r.orderDate}</dd></dl>
      <table class="grid" style="min-width:0;border:1px solid var(--st3)"><thead><tr><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Unit Price</th><th style="text-align:right">Amount</th></tr></thead><tbody><tr style="cursor:default"><td style="white-space:normal">${esc(r.itemName)}<br><span class="mono muted">${r.itemCode}</span></td><td class="num" style="text-align:right">${Number(r.qty).toLocaleString()}</td><td class="num" style="text-align:right">${won(r.price)}</td><td class="num" style="text-align:right">${won(r.amount)}</td></tr></tbody></table>
      <div class="invsum"><div><span>공급가액</span><b class="num">${won(r.amount)}</b></div><div><span>VAT (10%)</span><b class="num">${won(r.vat)}</b></div><div class="tot"><span>합계</span><b class="num">${won(r.total)}</b></div></div></div><p class="muted" style="margin-top:12px;font-size:12px">ERP Sales Order 정보로 생성한 Mock 인보이스입니다. 실제 연동 시 ERP에서 발행한 PDF가 첨부됩니다.</p>`;
  } else if (d.type === 'case') { const c = getCase(d.id); title = '업무 Case 이력'; wide = true; body = c ? `<div style="display:grid;gap:12px">${caseDetail(c, true)}</div>` : listLoading(); }
  $('#drawerRoot').innerHTML = `<div class="drw-ovl" data-act="drawer-close"></div><aside class="drw" style="${wide ? 'width:720px;background:var(--bg3)' : ''}" role="dialog" aria-label="${esc(title)}"><div class="drw-h" style="background:#fff"><h3>${esc(title)}</h3><button class="icb" data-act="drawer-close" aria-label="닫기">${ic('x')}</button></div><div class="drw-b">${body}</div>${foot}</aside>`;
}

/* =====================================================================
   Global search / notifications: GET /search · GET /notifications
   ===================================================================== */
function searchInput() {
  const raw = $('#gq').value; if (!raw.trim()) { ++SEQ.search; cancelLater('search'); $('#gpop').hidden = true; return; }
  later('search', 160, async () => {
    const q = $('#gq').value.trim(); if (!q) return;
    const my = ++SEQ.search; let d;
    try { d = await api('GET', '/search' + qs({ q })); } catch (err) { return; }
    if (my !== SEQ.search || $('#gq').value.trim() !== q) return;
    renderSearch($('#gq').value, d);
  });
}
function renderSearch(raw, d) {
  const pop = $('#gpop'), ms = (d && d.mails) || [], cs = (d && d.cases) || [];
  pop.hidden = false;
  pop.innerHTML = !ms.length && !cs.length ? `<div class="pop-empty">"${esc(raw)}" 검색 결과가 없습니다.</div>` : (cs.length ? `<h5>업무 Case</h5>` + cs.map(c => `<button class="pop-item" data-act="go-case" data-id="${c.caseId}">${ic('case', 'lg')}<div style="min-width:0"><div class="t"><span class="mono">${c.caseId}</span> ${esc(c.customer)}</div><div class="s">${esc(c.title)} · ${esc(c.status)}</div></div></button>`).join('') : '') + (ms.length ? `<h5>메일</h5>` + ms.map(e => `<button class="pop-item" data-act="go-mail" data-id="${e.emailId}">${ic('mail', 'lg')}<div style="min-width:0;flex:1"><div class="t">${esc(e.subject)}</div><div class="s">${esc(e.customer)} · ${fmtTime(e.receivedDate)}</div></div>${clsBadge(e.classification)}</button>`).join('') : '');
}
async function toggleNotif() {
  const p = $('#notifPop'), open = p.hidden; closePops(); if (!open) return;
  const my = ++SEQ.notif; let d;
  try { d = await api('GET', '/notifications'); } catch (err) { toast('error', '처리하지 못했습니다', err.message); return; }
  if (my !== SEQ.notif) return;
  renderNotif(d); p.hidden = false;
}
function renderNotif(d) {
  const er = (d && d.errors) || [], pd = (d && d.triage) || [];
  $('#notifPop').innerHTML = `<h5>알림 ${er.length + pd.length}건</h5>` + (er.length + pd.length ? er.map(x => `<button class="pop-item" data-act="go-mail" data-id="${x.emailId}"><span class="stt err"></span><div style="min-width:0"><div class="t">${esc(x.category)}</div><div class="s">${esc(x.customer)} · ${fmtTime(x.time)}</div></div></button>`).join('') + pd.map(e => `<button class="pop-item" data-act="go-mail" data-id="${e.emailId}"><span class="stt warn"></span><div style="min-width:0"><div class="t">${esc(e.status)} · ${esc(e.customer)}</div><div class="s">${esc(e.subject)}</div></div></button>`).join('') : '<div class="pop-empty">새 알림이 없습니다.</div>');
}
function closePops() { ++SEQ.notif; $('#gpop').hidden = true; $('#notifPop').hidden = true; }

/* =====================================================================
   Event handlers
   ===================================================================== */
const ACT = {
  nav: d => { closeDrawer(); return go(d.v); },
  kpi: d => { S.filter[d.v] = d.f; if (d.day) S.date = S.dashDate === today() ? { preset: 'today', from: '', to: '' } : { preset: 'custom', from: S.dashDate, to: S.dashDate }; S.sel[d.v] = null; return go(d.v); },
  'date-clear': () => { S.date = { preset: 'all', from: '', to: '' }; S.sel[S.view] = null; return reload(); },
  'dash-day': d => { const n = addDays(S.dashDate, Number(d.d)); if (n <= today()) { S.dashDate = n; return reload(); } },
  'dash-today': () => { S.dashDate = today(); return reload(); },
  'toggle-nav': () => $('#app').classList.toggle('collapsed'),
  refresh: async () => { const b = $('#btnRefresh svg'); if (b) { b.classList.remove('spin-once'); void b.offsetWidth; b.classList.add('spin-once'); } if (await reload({ meta: true })) toast('info', '동기화 완료', '메일함과 ERP 처리 상태를 최신으로 갱신했습니다.'); },
  'toggle-notif': () => toggleNotif(),
  'demo-reset': () => modalReset(),
  'boot-retry': () => boot(),
  'go-mail': d => { closePops(); closeDrawer(); $('#gq').value = ''; return goMail(d.id); },
  'go-case': d => { closePops(); closeDrawer(); $('#gq').value = ''; return goCase(d.id); },
  sel: d => selectRow(S.view, d.id),
  'sel-case': d => selectRow('cases', d.id),
  'sel-err': d => selectRow('errors', d.id),
  'back-list': () => { S.showD = false; render(); },
  filter: d => { S.filter[S.view] = d.v; S.sel[S.view] = null; return reload(); },
  more: () => { const e = curMail(); if (!e) return; S.menu = !S.menu; $('#dh').innerHTML = dhead(e); I18N.apply($('#dh')); },   /* 쓰기 직후 번역 / translate right after the write */
  'tri-class': d => mailAct('classify', { classification: d.k }),
  'tri-pick': d => mailAct('entity', { field: d.k, value: d.v, triage: true }),
  'tri-set': d => { const el = $('#tri-' + d.k), v = el ? el.value.trim() : ''; if (!v) { el && el.focus(); return toast('warn', '값을 입력해 주세요', ''); } return mailAct('entity', { field: d.k, value: v, triage: true }); },
  'tri-case': d => mailAct('link-case', { caseId: d.id }),
  'tri-newcase': () => mailAct('new-case'),
  erp: () => runErp(curMail()),
  order: () => { const e = curMail(); if (e) modalOrder(e); },
  draft: () => runDraft(curMail(), false),
  regen: () => runDraft(curMail(), true),
  send: () => { const e = curMail(); if (!e) return; if (!draftText(e).trim()) return toast('warn', '본문이 비어 있습니다', ''); modalSend(e); },
  'save-draft': () => saveDraft(curMail()),
  retry: () => runRetry(curMail()),
  'retry-error': d => { S.sel.errors = d.id; S.showD = true; return retryError(DATA.errById[d.id]); },
  'link-case': async () => { S.menu = false; const e = curMail(); if (!e) return; try { await loadAllCases(); } catch (err) { return toast('error', '처리하지 못했습니다', err.message); } modalLinkCase(e); },
  reclass: () => { S.menu = false; const e = curMail(); if (e) modalReclass(e); },
  'assign-cur': () => { S.menu = false; const e = curMail(); if (e) modalAssign('mail', e.emailId); },
  assign: d => modalAssign(d.kind, d.id),
  hold: () => { S.menu = false; const e = curMail(); if (e) return mailAct('hold', { on: !e.hold }); },
  complete: () => { S.menu = false; const e = curMail(); if (e) modalComplete(e); },
  'complete-now': () => mailAct('complete'),
  archive: () => mailAct('archive'),
  spam: () => mailAct('spam'),
  'view-att': d => modalAttachment(d.id, Number(d.i)),
  'view-so': d => openDrawer('so', d.so),
  'view-inv': () => { const e = curMail(); if (e) return openDrawer('inv', e.emailId); },
  'view-case': d => openDrawer('case', d.id),
  'modal-close': closeModal,
  'modal-bg': (d, el, ev) => { if (ev.target === el) closeModal(); },
  'modal-ok': () => { if (modalCb) return modalCb(); },
  'drawer-close': closeDrawer,
  'toast-close': (d, el) => el.closest('.toast').remove()
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!ev.target.closest('.gsearch') && !ev.target.closest('#notifPop') && !(el && el.dataset.act === 'toggle-notif')) closePops();
  if (S.menu && !(el && el.dataset.act === 'more') && !ev.target.closest('.menu')) { S.menu = false; const h = $('#dh'), m = curMail(); if (h && m) { h.innerHTML = dhead(m); I18N.apply(h); } }   /* 쓰기 직후 번역 / translate right after the write */
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) track(fn(el.dataset, el, ev));
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#modalRoot').innerHTML) closeModal(); else if (S.drawer) closeDrawer(); else closePops(); }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.row')) { ev.preventDefault(); ev.target.click(); }
  if (ev.key === 'Enter' && ev.target.matches('.tri-in input')) ev.target.parentElement.querySelector('button').click();
});
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset?.in;
  if (el.id === 'gq') return searchInput();
  if (k === 'q') { S.q = el.value; later('listq', 220, reloadList); }
  else if (k === 'draft') { const e = curMail(); if (e) S.draftEdit[e.emailId] = el.value; }
  else if (k === 'ent') {
    const e = curMail(), key = el.dataset.k; if (!e || e.closed) return;
    e.entities[key] = { value: el.value, conf: 1, src: 'user' };
    if (e.flow.erp === 'done' && ['customerCode', 'itemCode', 'quantity', 'salesOrder'].includes(key)) e.flow.erpStale = true;
    const bad = (REQUIRED[e.classification] || []).includes(key) && !el.value.trim(), row = el.closest('.ef');
    row.classList.toggle('low', bad); row.querySelector('.src').outerHTML = srcTag(e.entities[key], bad); I18N.apply(row);   /* 쓰기 직후 번역 / translate right after the write */
    queueEdit(e.emailId, key, el.value);
    refreshParts();
  }
});
document.addEventListener('change', ev => {
  const el = ev.target, k = el.dataset?.in; if (!k) return;
  if (k === 'dpreset') { S.date.preset = el.value; if (el.value === 'custom') { S.date.from = S.date.from || addDays(today(), -6); S.date.to = S.date.to || today(); } S.sel[S.view] = null; track(reload().then(() => { if (el.value === 'custom') $('[data-in="dfrom"]')?.focus(); })); }
  else if (k === 'dfrom' || k === 'dto') { const r = dateRange(); S.date = { preset: 'custom', from: k === 'dfrom' ? el.value : (S.date.preset === 'custom' ? S.date.from : r ? r[0] : ''), to: k === 'dto' ? el.value : (S.date.preset === 'custom' ? S.date.to : r ? r[1] : '') }; S.sel[S.view] = null; track(reload()); }
  else if (k === 'dashdate') { if (el.value && el.value <= today()) S.dashDate = el.value; track(reload()); }
  else if (k === 'ent') track(flushEdits());   /* 입력칸을 벗어나면 바로 저장 / save at once when leaving the field */
});
$('#gq').addEventListener('focus', searchInput);
let wasNarrow = isNarrow();
window.addEventListener('resize', () => { if (isNarrow() !== wasNarrow) { wasNarrow = isNarrow(); track(reload({ list: false })); } });
/* 첫 화면 = 주소의 #view=<메뉴>(리소스 센터 카드가 이 형식으로 연다), 없으면 Dashboard
   first view = #view=<menu> in the address (the resource-center card opens it this way), else the dashboard */
function hashView() { try { const v = new URLSearchParams(String(location.hash || '').replace(/^#/, '')).get('view'); return NAV_KEYS.includes(v) ? v : null; } catch (err) { return null; } }
window.addEventListener('hashchange', () => { const v = hashView(); if (v && BOOT.done && v !== S.view) { closeDrawer(); closePops(); track(go(v)); } });

async function boot() {
  BOOT.error = ''; BOOT.done = false; render();
  const hv = hashView(); if (hv) S.view = hv;
  try { await loadMeta(); } catch (err) { BOOT.error = err.message; render(); return; }
  if (!META) { BOOT.error = '서버에 연결할 수 없습니다'; render(); return; }
  S.dashDate = today(); BOOT.done = true;
  await reload();
}

/* 번역 층 연결(렌더 함수 감싸기) 후 서버에서 첫 화면을 받는다 / hook up the translation layer, then load the first screen from the server */
I18N.install();
track(boot());
</script>
</body>
