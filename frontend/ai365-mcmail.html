  --info:#3f7fc2;--info-p:#2a5f98;
  /* 따뜻한 중립색: 브랜드 색조를 옅게 섞었다(흰 바탕 대비 fg 15.5 · fg2 9.7 · fg3 6.7 · fg4 4.9:1)
     warm neutrals with a faint brand tint (contrast on white: fg 15.5, fg2 9.7, fg3 6.7, fg4 4.9:1) */
  --fg:#2b2220;--fg2:#4d4240;--fg3:#655957;--fg4:#7a6e6c;--dis:#c2b8b6;
  --bg:#ffffff;--bg2:#fbf8f7;--bg3:#f6f2f1;--nav:#f2edeb;--st:#ebe3e0;--st2:#ddd3d0;--st3:#f2ecea;
  /* 업무 분류 꼬리표: 기존 색상의 옅은 톤 / category tags: softer tints of the existing hues */
  --q-bg:#eef4fb;--q-fg:#235a92;--q-bd:#d6e4f4;
  --o-bg:#f4f0fb;--o-fg:#5b3f9e;--o-bd:#e2d9f3;
  --s-bg:#edf6ef;--s-fg:#22683a;--s-bd:#d0e7d7;
  --k-bg:#eaf5f4;--k-fg:#1a625f;--k-bd:#cae5e2;--i-bg:#fbf5e6;--i-fg:#7a5a12;--i-bd:#efe0b8;
  --e-bg:#f3efee;--e-fg:#5d5351;--e-bd:#e3dbd9;
  /* 상태(글자 · 바탕 · 테두리 · 점). 점 위 흰 숫자·아이콘은 3:1 이상 / statuses (text, background, border, dot); white marks on dots keep 3:1+ */
  --warn:#9a4a0e;--warn-bg:#fdf5ec;--warn-bd:#f3d6b8;--warn-dot:#d9772a;
  --err:#b3261e;--err-bg:#fcf2f1;--err-bd:#efc3bf;--err-dot:#c8413c;
  --ok:#1f6b3d;--ok-bg:#eff8f2;--ok-bd:#c6e4d0;--ok-dot:#3b8f5c;
  /* 그림자: 카드는 부드러운 두 겹, 서랍·모달은 깊게 / shadows: soft two layers for cards, deep for drawers and modals */
  --sh2:0 1px 2px rgba(58,32,30,.05),0 2px 8px rgba(58,32,30,.04);
  --sh8:0 2px 4px rgba(58,32,30,.05),0 10px 24px rgba(58,32,30,.08);
  --sh16:0 4px 12px rgba(43,26,24,.08),0 16px 36px rgba(43,26,24,.12);
  --sh64:0 12px 28px rgba(43,26,24,.14),0 32px 72px rgba(43,26,24,.24);
  --ring:0 0 0 3px rgba(155,79,76,.18);
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
  --sans:"Pretendard","Pretendard Local",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  --navw:236px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);font-size:13.5px;line-height:1.5;color:var(--fg);background:var(--bg3);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;word-break:keep-all;overflow-wrap:break-word;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--brand-t2);color:var(--fg)}
*{scrollbar-width:thin;scrollbar-color:#d9cfcc transparent}
.ic{width:16px;height:16px;flex:none}
.ic.lg{width:20px;height:20px}
.ic.sm{width:13px;height:13px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.num,time{font-variant-numeric:tabular-nums}
.muted{color:var(--fg3)}
.sp{flex:1}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--navw) minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100%}
.app.collapsed{--navw:56px}
.hdr{grid-column:1/3;background:#fff;color:var(--fg);border-bottom:1px solid var(--st);display:flex;align-items:center;gap:10px;padding:0 16px 0 8px;position:relative;z-index:30}
.hdr .icb{color:var(--fg2)}
.brand{display:flex;align-items:center;gap:12px;padding:0 12px 0 4px;white-space:nowrap}
.brand img{display:block}
.brand .mk{height:30px}
.brand .wm{height:13px;margin-top:1px}
.brand i{width:1px;height:20px;background:var(--st2)}
.brand span{font-size:14px;font-weight:600;color:var(--fg2);letter-spacing:-.01em}
.gsearch{position:relative;flex:1;max-width:540px;margin:0 auto}
.gsearch input{width:100%;height:36px;border:1px solid var(--st3);border-radius:10px;background:var(--bg2);padding:0 14px 0 38px;color:var(--fg);transition:background-color .15s,border-color .15s,box-shadow .15s}
.gsearch input::placeholder{color:var(--fg4)}
.gsearch input:hover{border-color:var(--st)}
.gsearch input:focus{background:#fff;outline:0;border-color:var(--brand);box-shadow:var(--ring)}
.gsearch>.ic{position:absolute;left:12px;top:10px;color:var(--fg4);pointer-events:none}
.pop{position:absolute;top:44px;background:#fff;color:var(--fg);border:1px solid var(--st);border-radius:12px;box-shadow:var(--sh16);z-index:40;overflow:hidden;padding:4px}
.gsearch .pop{left:0;right:0;max-height:440px;overflow:auto}
.pop h5{margin:0;padding:10px 10px 4px;font-size:12px;font-weight:600;color:var(--fg3)}
.pop-item{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;background:none;text-align:left;border-radius:8px;transition:background-color .12s}
.pop-item>.ic{color:var(--fg3)}
.pop-item:hover,.pop-item:focus-visible{background:var(--bg2)}
.pop-item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-item .s{font-size:12px;color:var(--fg3)}
.pop-empty{padding:16px 12px;color:var(--fg3)}
.hdr-r{display:flex;align-items:center;gap:4px;position:relative}
.icb{width:34px;height:34px;display:inline-grid;place-items:center;border:0;background:none;border-radius:8px;color:var(--fg2);position:relative;transition:background-color .15s,color .15s}
.icb:hover{background:var(--bg3);color:var(--fg)}
.icb:disabled{color:var(--dis);background:none}
.icb .cnt{position:absolute;top:0;right:-1px;min-width:18px;height:18px;border-radius:999px;background:var(--err-dot);color:#fff;font-size:11.5px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0 4px;border:2px solid #fff;font-variant-numeric:tabular-nums}
.spin-once{animation:rot .8s ease}
.profile{display:flex;align-items:center;gap:9px;margin-left:8px;padding:0 4px 0 12px;border-left:1px solid var(--st3)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-t2);color:var(--brand-p);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.profile .n{font-weight:600;line-height:1.25}
.profile .r{font-size:12px;color:var(--fg3);line-height:1.25}
#notifPop{right:40px;width:380px;max-height:460px;overflow:auto}

/* ---------- Nav ---------- */
.nav{background:var(--nav);border-right:1px solid var(--st);display:flex;flex-direction:column;gap:2px;overflow:hidden auto;padding:14px 10px 10px}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;height:36px;flex:none;padding:0 10px 0 12px;border:0;background:none;border-radius:8px;color:var(--fg2);font-weight:500;text-align:left;position:relative;white-space:nowrap;transition:background-color .15s,color .15s}
.nav-i .ic{color:var(--fg3)}
.nav-i:hover{background:rgba(155,79,76,.07);color:var(--fg)}
.nav-i.on{background:#fff;color:var(--brand-p);font-weight:600;box-shadow:0 1px 2px rgba(58,32,30,.07),0 0 0 1px rgba(58,32,30,.05)}
.nav-i.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-i.on .ic{color:var(--brand)}
.nav-i .c{margin-left:auto;display:inline-grid;place-items:center;height:20px;min-width:22px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1;color:var(--fg3);background:rgba(58,32,30,.07);font-variant-numeric:tabular-nums}
.nav-i.on .c{background:var(--brand-t2);color:var(--brand-p)}
.nav-i .c.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-bd)}
.nav-i .c.err{background:var(--err-bg);color:var(--err);box-shadow:inset 0 0 0 1px var(--err-bd)}
.nav-sep{height:1px;flex:none;background:var(--st);margin:8px 10px}
.nav-foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:var(--fg3);display:grid;gap:6px}
.nav-foot div{display:flex;align-items:center;gap:8px;white-space:nowrap}
/* 데모 초기화: 시나리오 드로어가 없어진 뒤(2026-10-13) 사이드바 아래에 둔다 / demo reset lives at the sidebar foot since the scenario drawer is gone (2026-10-13) */
.nav-reset{display:flex;align-items:center;gap:8px;white-space:nowrap;border:0;background:none;color:var(--fg3);font:inherit;font-size:12px;padding:4px 0;cursor:pointer;border-radius:6px}
.nav-reset:hover{color:var(--brand-p)}
.nav-reset .ic{color:inherit;flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok-dot);flex:none;box-shadow:0 0 0 3px rgba(59,143,92,.16)}
.app.collapsed .nav-i span,.app.collapsed .nav-i .c,.app.collapsed .nav-foot span{display:none}
.app.collapsed .nav{padding:14px 8px 10px}
.app.collapsed .nav-i{padding:0;justify-content:center}

/* ---------- Main / page ---------- */
.main{overflow:hidden;position:relative;background:var(--bg3)}
.scroll{height:100%;overflow:auto}
.page{padding:28px 32px 48px;max-width:1720px;margin:0 auto}
.ph{display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px 16px;margin-bottom:20px}
.ph h1{font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.015em}
.ph p{color:var(--fg3);margin-top:4px}
.card{background:#fff;border:1px solid var(--st);border-radius:12px;box-shadow:var(--sh2)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--st3);min-height:52px}
.card-h>.ic{color:var(--brand)}
.card-h h3{font-size:15px;font-weight:700;white-space:nowrap}
.card-h .sub{color:var(--fg3);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-h .link{white-space:nowrap}
.card-b{padding:16px 18px}

/* buttons */
.btn{height:34px;padding:0 14px;border:1px solid var(--st2);background:#fff;border-radius:8px;font-size:13.5px;font-weight:600;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--fg);transition:background-color .15s,border-color .15s,box-shadow .15s,color .15s}
.btn:hover{background:var(--bg2);border-color:#cfc4c1}
.btn:active{background:var(--st3)}
.btn-p{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(115,55,52,.24)}
.btn-p:hover{background:var(--brand-h);border-color:var(--brand-h)}
.btn-p:active{background:var(--brand-p);border-color:var(--brand-p)}
.btn-ok{background:#1f7a45;border-color:#1f7a45;color:#fff;box-shadow:0 1px 2px rgba(31,107,61,.22)}.btn-ok:hover{background:#196a3b;border-color:#196a3b}
.btn-sub{border-color:transparent;background:transparent;color:var(--fg2)}
.btn-sub:hover{background:var(--bg3);border-color:transparent;color:var(--fg)}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn:disabled,.btn-p:disabled,.btn-ok:disabled{background:var(--bg3);border-color:var(--st);color:var(--dis);box-shadow:none}
.btn-sub:disabled{background:transparent;border-color:transparent}
.link{border:0;background:none;padding:0;color:var(--brand);font-weight:600;border-radius:4px}
.link:hover{color:var(--brand-h);text-decoration:underline;text-underline-offset:2px}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;flex:none;opacity:.85}
.spinner.lg{width:22px;height:22px;border-width:2.5px;color:var(--brand)}
@keyframes rot{to{transform:rotate(360deg)}}

/* badges: 알약 하나의 모양(22px · 완전 둥근 모서리 · 12px/600) / one pill shape (22px, fully rounded, 12px/600) */
.bdg{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1;white-space:nowrap;border:1px solid transparent}
.bdg-quote{background:var(--q-bg);color:var(--q-fg);border-color:var(--q-bd)}
.bdg-order{background:var(--o-bg);color:var(--o-fg);border-color:var(--o-bd)}
.bdg-ship{background:var(--s-bg);color:var(--s-fg);border-color:var(--s-bd)}
.bdg-stock{background:var(--k-bg);color:var(--k-fg);border-color:var(--k-bd)}
.bdg-invoice{background:var(--i-bg);color:var(--i-fg);border-color:var(--i-bd)}
.bdg-etc{background:var(--e-bg);color:var(--e-fg);border-color:var(--e-bd)}
.bdg-none{background:#fff;color:var(--fg3);border:1px dashed var(--st2)}
.stt{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.2;white-space:nowrap;color:var(--fg2)}
.stt::before{content:"";width:7px;height:7px;border-radius:50%;background:#a99d9b;flex:none}
.stt.prog{color:var(--info-p)}.stt.prog::before{background:var(--info)}
.stt.warn{color:var(--warn)}.stt.warn::before{background:var(--warn-dot)}
.stt.err{color:var(--err)}.stt.err::before{background:var(--err-dot)}
.stt.done{color:var(--ok)}.stt.done::before{background:var(--ok-dot)}
.stt.pill{height:22px;padding:0 10px 0 8px;border-radius:999px;background:var(--bg3)}
.stt.pill.prog{background:var(--q-bg)}.stt.pill.warn{background:var(--warn-bg)}.stt.pill.err{background:var(--err-bg)}.stt.pill.done{background:var(--ok-bg)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--bg3);border:1px solid var(--st);font-size:12px;color:var(--fg2);font-weight:600;line-height:1;white-space:nowrap}
.chip.sm{height:20px;padding:0 7px;font-size:11.5px}

/* toolbar, filters */
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--st3)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--st2);background:#fff;font-size:12.5px;font-weight:600;color:var(--fg2);display:inline-flex;gap:6px;align-items:center;transition:background-color .15s,border-color .15s,color .15s}
.fchip:hover{background:var(--bg2);border-color:#cfc4c1;color:var(--fg)}
.fchip.on{background:var(--brand-t);border-color:var(--brand-t3);color:var(--brand-p)}
.fchip em{font-style:normal;font-size:11.5px;color:var(--fg3);font-weight:600;font-variant-numeric:tabular-nums}
.fchip.on em{color:var(--brand)}
.sbox{display:flex;align-items:center;border:1px solid var(--st2);border-radius:10px;background:#fff;height:36px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.sbox:hover{border-color:#cfc4c1}
.sbox:focus-within{border-color:var(--brand);box-shadow:var(--ring)}
.sbox select{border:0;border-right:1px solid var(--st);height:100%;background:var(--bg2);padding:0 6px 0 8px;outline:0}
.sbox input{border:0;outline:0;height:100%;padding:0 12px 0 8px;width:210px;background:none}
.sbox input::placeholder{color:var(--fg4)}
.sbox .ic{margin-left:12px;color:var(--fg4)}

/* grid */
.gridw{overflow:auto}
table.grid{width:100%;border-collapse:collapse;min-width:980px}
.grid th{position:sticky;top:0;background:var(--bg2);text-align:left;font-size:12px;font-weight:600;color:var(--fg3);padding:10px 12px;border-bottom:1px solid var(--st);white-space:nowrap;z-index:1}
.grid td{padding:10px 12px;border-bottom:1px solid var(--st3);vertical-align:middle;white-space:nowrap}
.grid tr:last-child td{border-bottom:0}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:var(--bg2)}
.grid tbody tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.grid .subj{max-width:320px;overflow:hidden;text-overflow:ellipsis}
.grid .subj b{font-weight:600}
.grid tr.closed .subj b{font-weight:400;color:var(--fg2)}
.grid .wrap{white-space:normal;min-width:220px;max-width:340px}
.cf{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-variant-numeric:tabular-nums}
.cf i{display:block;width:48px;height:5px;border-radius:999px;background:var(--st3);overflow:hidden}
.cf i b{display:block;height:100%;border-radius:999px;background:var(--ok-dot)}
.cf.mid i b{background:var(--info)}.cf.low i b{background:var(--warn-dot)}
.cf.low{color:var(--warn)}
.gfoot{display:flex;padding:10px 16px;border-top:1px solid var(--st3);color:var(--fg3);font-size:12px}
.empty{padding:52px 24px;text-align:center;color:var(--fg3);line-height:1.6}
.empty b{display:block;color:var(--fg);font-size:14.5px;font-weight:600;margin-bottom:4px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px 15px;text-align:left;border:1px solid var(--st);border-radius:12px;background:#fff;box-shadow:var(--sh2);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%;transition:border-color .15s,box-shadow .15s}
.kpi:hover{border-color:var(--st2);box-shadow:var(--sh8)}
.kpi .l{display:flex;align-items:center;gap:10px;color:var(--fg2);font-weight:600;font-size:12.5px;line-height:1.3}
.kpi .l .ic{width:30px;height:30px;padding:7px;border-radius:9px;background:var(--brand-t);color:var(--brand)}
.kpi.warn .l .ic{background:var(--warn-bg);color:var(--warn-dot)}.kpi.ok .l .ic{background:var(--ok-bg);color:var(--ok-dot)}.kpi.err .l .ic{background:var(--err-bg);color:var(--err-dot)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.15;margin-top:14px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--fg3);margin-left:4px;letter-spacing:0}
.kpi .d{font-size:12px;color:var(--fg3);margin-top:4px}
.kpi.warn .v{color:var(--warn)}.kpi.err .v{color:var(--err)}.kpi.ok .v{color:var(--ok)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.dgrid.one{grid-template-columns:minmax(0,1fr)}   /* 시나리오 카드가 없어진 뒤 활동 카드 하나 / the activity card alone since the scenario card is gone */
.trow{display:grid;grid-template-columns:132px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:8px 8px;margin:0 -8px;border:0;background:none;width:calc(100% + 16px);text-align:left;border-radius:8px;transition:background-color .12s}
.trow:hover{background:var(--bg2)}
.tbar{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;background:var(--st3)}
.tbar b{display:block;height:100%;min-width:3px}
.seg-done{background:var(--ok-dot)}.seg-prog{background:var(--info)}.seg-warn{background:var(--warn-dot)}.seg-err{background:var(--err-dot)}
.legend{display:flex;gap:6px 16px;font-size:12px;color:var(--fg3);margin-top:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
.tier{display:grid;grid-template-columns:156px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:8px 0}
.tier .tl{padding:0}   /* 이력 타임라인 .tl 의 여백을 받지 않는다 / keeps clear of the timeline .tl padding */
.tier .tl b{display:block;font-weight:600}.tier .tl span{font-size:12px;color:var(--fg3)}
/* 분류 꼬리표 칸을 고정해 제목 줄을 맞춘다 / a fixed tag column keeps the titles aligned */
.todo{display:grid;grid-template-columns:128px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--st3);transition:background-color .12s}
.todo>.bdg{justify-self:start;max-width:100%}
.todo:hover{background:var(--bg2)}
.todo:last-child{border-bottom:0}
.todo .tx{min-width:0;flex:1}
.todo .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .tx span{font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums}
.feed{list-style:none;margin:0;padding:8px 18px 12px}
.feed li{display:grid;grid-template-columns:44px 20px minmax(0,1fr);gap:8px;padding:8px 0;align-items:start;font-size:13px;border-bottom:1px solid var(--st3)}
.feed li:last-child{border-bottom:0}
.feed time{color:var(--fg3);font-size:12px;padding-top:1px}
.feed .ic{margin-top:2px;color:var(--fg3)}
.feed .ok{color:var(--ok-dot)}.feed .er{color:var(--err-dot)}.feed .ai{color:var(--brand)}

/* detail */
.d-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.d-top h1{font-size:18px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb{color:var(--fg3);font-size:12px;margin-bottom:2px}
.pipe{display:flex;align-items:center;margin:0 0 12px;padding:12px 18px;background:#fff;border:1px solid var(--st);border-radius:12px}
.pstep{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:12px;font-weight:600;color:var(--fg4);white-space:nowrap}
.pstep i{font-style:normal;font-size:11.5px;font-weight:700;line-height:1;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--st2);display:grid;place-items:center;flex:none;background:#fff;color:#fff}
.pstep i .ic{width:11px;height:11px;stroke-width:2.4}
.pstep::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--st);margin:0 10px;min-width:10px}
.pstep:last-child{flex:none}.pstep:last-child::after{display:none}
.pstep.done{color:var(--fg2)}.pstep.done i{background:var(--ok-dot);border-color:var(--ok-dot)}.pstep.done::after{background:var(--ok-dot)}
.pstep.cur{color:var(--brand-p)}.pstep.cur i{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-t2)}
.pstep.cur i::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand)}
.pstep.warn{color:var(--warn)}.pstep.warn i{background:var(--warn-dot);border-color:var(--warn-dot)}
.pstep.err{color:var(--err)}.pstep.err i{background:var(--err-dot);border-color:var(--err-dot)}
.abar{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:#fff;border:1px solid var(--st);border-radius:12px;box-shadow:var(--sh2);margin-bottom:12px}
.abar .vsep{width:1px;height:20px;background:var(--st);margin:0 4px}
.snap{display:grid;grid-template-columns:minmax(230px,.9fr) minmax(0,1.7fr) minmax(250px,1fr);margin-bottom:12px}
.snap>section{padding:14px 18px;border-right:1px solid var(--st3);min-width:0}
.snap>section:last-child{border-right:0;background:var(--bg2);border-radius:0 12px 12px 0}
.snap h4{font-size:12px;font-weight:600;color:var(--fg3);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.snap .cid{font-size:14px;font-weight:600}
.snap .kvs{display:flex;flex-wrap:wrap;gap:6px 22px}
.snap .kv span{display:block;font-size:11.5px;color:var(--fg3)}
.snap .kv b{font-weight:600;font-size:13.5px}
.snap .kv s{color:var(--fg4);font-weight:400;margin-right:5px;font-size:12px}
.snap .next b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.snap .next p{color:var(--fg3);font-size:12px;margin-bottom:9px}
.d-cols{display:grid;grid-template-columns:minmax(0,1fr) 388px;gap:14px;align-items:start}
.d-left{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.mailmeta{display:flex;gap:12px;align-items:center}
.mailmeta .who b{font-weight:600}
.mailmeta .who span{display:block;font-size:12px;color:var(--fg3)}
.mailbody{white-space:pre-wrap;line-height:1.7;font-size:13.5px;color:var(--fg);padding:16px 18px 18px 58px}
.cond{display:flex;flex-wrap:wrap;gap:6px 20px;padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--st3);font-size:12px;color:var(--fg3)}
.cond b{color:var(--fg);font-family:var(--mono);font-weight:500;margin-left:6px}
.api{font-family:var(--mono);font-size:11.5px;color:var(--fg3);padding:9px 18px;border-top:1px solid var(--st3);background:var(--bg2);border-radius:0 0 11px 11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.api .okc{color:var(--ok)}.api .erc{color:var(--err)}
.kvt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 20px}
.kvt div>span:first-child{display:block;font-size:12px;color:var(--fg3);margin-bottom:2px}
.kvt div b{font-weight:600;font-size:14px}
.pv{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--st);border-radius:10px;overflow:hidden}
.pv div{display:grid;grid-template-columns:128px minmax(0,1fr);border-bottom:1px solid var(--st3);min-height:38px}
.pv div:nth-last-child(-n+2){border-bottom:0}
.pv div:nth-child(odd){border-right:1px solid var(--st3)}
.pv span{background:var(--bg2);padding:9px 12px;color:var(--fg3);font-size:12px;font-weight:600;display:flex;align-items:center}
.pv b{padding:9px 12px;font-weight:600;display:flex;align-items:center;word-break:keep-all;overflow-wrap:anywhere}
.pv b.bad{color:var(--err)}
.msg{display:flex;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--st);background:var(--bg2);align-items:flex-start;line-height:1.55}
.msg .ic{margin-top:2px;color:var(--fg3)}
.msg b{display:block;font-weight:600}
.msg p{font-size:12.5px;color:var(--fg2)}
.msg.ok{background:var(--ok-bg);border-color:var(--ok-bd)}.msg.ok .ic,.msg.ok b{color:var(--ok)}
.msg.err{background:var(--err-bg);border-color:var(--err-bd)}.msg.err .ic,.msg.err b{color:var(--err)}
.msg.warn{background:var(--warn-bg);border-color:var(--warn-bd)}.msg.warn .ic,.msg.warn b{color:var(--warn)}
.msg.info{background:var(--q-bg);border-color:var(--q-bd)}.msg.info .ic{color:var(--info)}
.msg .btn .ic{color:inherit!important;margin-top:0}
.success{border:1px solid var(--ok-bd);background:var(--ok-bg);border-radius:12px;padding:18px}
.success .hd{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700;font-size:15px;margin-bottom:6px}
.success .hd i{width:26px;height:26px;border-radius:50%;background:var(--ok-dot);color:#fff;display:grid;place-items:center}
.success .so{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--fg);margin:6px 0 14px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.loadbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 16px;color:var(--fg2);font-weight:600}
.loadbox small{font-weight:400;color:var(--fg3);font-family:var(--mono);font-size:11.5px}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,#f1ebe9 25%,#f8f4f3 37%,#f1ebe9 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;margin:10px 0}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.rfield{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--st3);padding:8px 18px;font-size:12.5px}
.rfield span{color:var(--fg3)}
.rfield input{border:0;outline:0;background:none;padding:2px 0;font-weight:600;min-width:0}
textarea.draft{display:block;width:100%;min-height:240px;border:0;outline:0;resize:vertical;padding:16px 18px;line-height:1.75;font-size:13.5px;background:#fff;border-radius:0 0 11px 11px}
textarea.draft:focus-visible{box-shadow:inset 0 0 0 2px var(--brand-t3)}
textarea.draft:read-only{background:var(--bg2);color:var(--fg2)}
.rfoot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--st3);background:var(--bg2);border-radius:0 0 11px 11px}
.autosend{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--fg3)}
.tog{width:30px;height:16px;border-radius:8px;border:1.5px solid var(--dis);position:relative;display:block}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--dis)}
.cand{display:flex;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--st);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff;transition:background-color .12s,border-color .12s}
.cand:hover{border-color:var(--st2);background:var(--bg2)}
.cand:has(input:checked){border-color:var(--brand);background:var(--brand-t);box-shadow:0 0 0 1px var(--brand)}
.cand input{accent-color:var(--brand);width:15px;height:15px;margin:0}
.cand b{font-weight:600}
.cand small{display:block;color:var(--fg3);font-size:12px}
.thread{list-style:none;margin:0;padding:4px 0}
.thread li{display:grid;grid-template-columns:96px 84px minmax(0,1fr);gap:10px;padding:8px 18px;align-items:center;font-size:12.5px}
.thread li.me{background:var(--brand-t)}
.thread li .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread button{border:0;background:none;text-align:left;padding:0;font-weight:600;color:var(--fg)}
.thread button:hover{color:var(--brand);text-decoration:underline}
.dir{font-size:11.5px;font-weight:600;color:var(--fg3)}
.dir.out{color:var(--brand-p)}

/* AI panel */
.ai{background:#fff;border:1px solid var(--st);border-radius:12px;box-shadow:var(--sh2);overflow:hidden}
.ai-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--st3);background:linear-gradient(180deg,var(--brand-t),#fff)}
.ai-h h3{font-size:15px;font-weight:700}
.ai-h .ic{color:var(--brand)}
.ai-s{padding:14px 16px;border-bottom:1px solid var(--st3)}
.ai-s:last-child{border-bottom:0}
.ai-s h4{font-size:12.5px;font-weight:600;color:var(--fg2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ai-s h4 .note{margin-left:auto;font-size:12px;font-weight:500;color:var(--fg3)}
.ai-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai-two>div>span:first-child{display:block;font-size:12px;color:var(--fg3);margin-bottom:4px}
.conf{display:flex;align-items:baseline;gap:10px}
.conf b{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.conf em{font-style:normal;font-weight:600;font-size:12.5px}
.conf.hi b,.conf.hi em{color:var(--ok)}.conf.mid b,.conf.mid em{color:var(--info-p)}.conf.low b,.conf.low em{color:var(--warn)}
.cbar{position:relative;height:6px;border-radius:999px;background:var(--st3);margin:9px 0 5px}
.cbar b{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--ok-dot)}
.conf.mid+.cbar b{background:var(--brand)}.conf.low+.cbar b{background:var(--warn-dot)}
.cbar i{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:#a99d9b}
.cscale{position:relative;height:16px;font-size:11.5px;color:var(--fg4)}
.cscale span{position:absolute;transform:translateX(-50%)}
.caselink{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--st);border-radius:10px;background:var(--bg2);text-align:left}
.caselink:hover{border-color:var(--brand);background:var(--brand-t)}
.caselink b{display:block;font-weight:600}
.caselink small{color:var(--fg3);font-size:12px}
.ef{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
.ef label{font-size:12px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ef input{width:100%;height:32px;border:1px solid var(--st2);border-radius:8px;padding:0 10px;background:#fff;font-weight:600;font-size:13px;transition:border-color .15s,box-shadow .15s}
.ef input:hover{border-color:#cfc4c1}
.ef input:focus{outline:0;border-color:var(--brand);box-shadow:var(--ring)}
.ef input:read-only{background:var(--bg2);color:var(--fg2)}
.ef.low input{border-color:var(--warn-dot);background:var(--warn-bg)}
.ef .src{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--fg3);min-width:18px;justify-content:flex-end}
.ef .src.ai{color:var(--info)}.ef .src.user{color:var(--ok)}.ef .src.low{color:var(--warn)}
.ef-note{grid-column:2/4;font-size:11.5px;color:var(--warn);margin:-2px 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srclegend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:11.5px;color:var(--fg3);margin-top:12px;padding-top:10px;border-top:1px dashed var(--st)}
.srclegend span{display:inline-flex;gap:4px;align-items:center}
.delta{display:grid;grid-template-columns:64px minmax(0,1fr) 18px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:8px}
.delta label{font-size:12px;color:var(--fg3)}
.delta .bf,.delta .af{padding:7px 10px;border-radius:8px;font-weight:600;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.delta .bf{background:var(--bg3);color:var(--fg3);text-decoration:line-through;text-decoration-color:#bcb1af}
.delta .af{background:var(--brand-t);color:var(--brand-p);box-shadow:inset 0 0 0 1px var(--brand-t3)}
.delta .ic{color:var(--fg4)}
.dcap{display:grid;grid-template-columns:64px 1fr 18px 1fr;gap:8px;font-size:11.5px;color:var(--fg4);margin-bottom:4px;text-align:center}
.kept{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--fg3);margin-top:10px}
.rec{font-weight:600;font-size:13.5px;margin-bottom:8px}
.recsteps{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:5px}
.recsteps li{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--fg2)}
.recsteps li i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--st2);display:grid;place-items:center;flex:none;color:#fff}
.recsteps li i .ic{width:10px;height:10px;stroke-width:2.6}
.recsteps li.done{color:var(--fg4)}.recsteps li.done i{background:var(--ok-dot);border-color:var(--ok-dot)}
.recsteps li.cur{font-weight:600;color:var(--fg)}.recsteps li.cur i{border-color:var(--brand)}
.reason{font-size:12.5px;color:var(--fg2);line-height:1.65}

/* case detail */
.chead{display:flex;gap:24px;align-items:flex-start;padding:22px 24px;margin-bottom:12px;flex-wrap:wrap}
.chead h1{font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.015em}
.chead h2{font-size:14px;font-weight:400;color:var(--fg2);margin-top:3px}
.chead .metas{display:flex;gap:10px 28px;flex-wrap:wrap;margin-left:auto}
.chead .metas div span{display:block;font-size:12px;color:var(--fg3);margin-bottom:5px}
.chead .metas div b{font-weight:600}
.c3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:0 12px;margin:0}
.dl dt{color:var(--fg3);font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--st3)}
.dl dd{margin:0;font-weight:600;padding:7px 0;border-bottom:1px solid var(--st3);min-width:0;overflow-wrap:anywhere}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}
.dl dd .mono{white-space:nowrap}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--st3)}
.alist li:last-child{border-bottom:0}
.alist small{color:var(--fg3);font-size:12px;grid-column:1/3}
.tl{list-style:none;margin:0;padding:20px 22px 8px;position:relative}
.tl li{display:grid;grid-template-columns:92px 22px minmax(0,1fr);gap:0 12px;position:relative;padding-bottom:20px}
.tl li::before{content:"";position:absolute;left:114px;top:18px;bottom:-2px;width:2px;border-radius:2px;background:var(--st3)}
.tl li:last-child::before{display:none}
.tl time{font-size:12px;color:var(--fg3);text-align:right;padding-top:1px}
.tl .nd{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--brand);background:#fff;margin:2px 4px 0;position:relative;z-index:1}
.tl li.out .nd{background:var(--brand)}
.tl li.sys .nd{border-radius:3px;border-color:#a99d9b;width:10px;height:10px;margin:4px 6px 0;transform:rotate(45deg);background:#fff}
.tl li.sys.ok .nd{border-color:var(--ok-dot);background:var(--ok-dot)}.tl li.sys.er .nd{border-color:var(--err-dot);background:var(--err-dot)}
.tl li.now .nd{border-color:var(--fg);background:var(--fg)}
.tl .tc{min-width:0}
.tl .tc button.tt{border:0;background:none;padding:0;font-weight:600;font-size:13.5px;text-align:left}
.tl .tc button.tt:hover{color:var(--brand);text-decoration:underline}
.tl .tc p{color:var(--fg2);margin-top:3px}
.tl .tc q{display:block;quotes:none;color:var(--fg3);margin-top:3px;font-size:12.5px}
.tl li.sys .tc{font-size:12.5px;color:var(--fg3)}
.tl li.now .tc b{font-size:14px}

/* pending cards */
.pcard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;margin-bottom:12px}
.pcard>div{padding:14px 16px;min-width:0}
.pcard>div+div{border-left:1px solid var(--st3);background:var(--bg2);border-radius:0 12px 12px 0}
.pcard h3{font-size:14px;font-weight:600;margin:8px 0 2px}
.pcard blockquote{margin:8px 0 0;padding:8px 12px;background:var(--bg2);border-radius:8px;color:var(--fg2);font-size:12.5px;white-space:pre-wrap;max-height:84px;overflow:hidden}
.pcard h4{font-size:12px;color:var(--fg3);font-weight:600;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.reasons{margin:0 0 10px;padding:0;list-style:none;display:grid;gap:4px}
.reasons li{display:flex;gap:6px;align-items:center;color:var(--warn);font-weight:600;font-size:12.5px}

/* modal / drawer / toast */
.ovl{position:fixed;inset:0;background:rgba(43,34,32,.42);backdrop-filter:blur(2px);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .15s ease}
.modal{background:#fff;border-radius:14px;box-shadow:var(--sh64);width:100%;max-width:470px;max-height:88vh;display:flex;flex-direction:column;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.modal.wide{max-width:640px}
.m-h{display:flex;align-items:center;gap:8px;padding:20px 18px 8px 24px}
.m-h h3{font-size:17px;font-weight:700;flex:1}
.m-b{padding:6px 24px 16px;overflow:auto;color:var(--fg2);line-height:1.6}
.m-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px 20px;border-top:1px solid var(--st3)}
.m-kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px 12px;margin-top:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--st3);border-radius:10px;font-size:12.5px}
.m-kv span{color:var(--fg3)}
.m-kv b{font-weight:600;word-break:break-all}
.optg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 16px}
.optg .cand{margin:0}
.fsel{width:100%;height:36px;border:1px solid var(--st2);border-radius:8px;padding:0 10px;background:#fff}
.fsel:focus{outline:0;border-color:var(--brand);box-shadow:var(--ring)}
.flabel{display:block;font-size:12px;font-weight:600;color:var(--fg3);margin:6px 0 8px}
.drw-ovl{position:fixed;inset:0;background:rgba(43,34,32,.28);z-index:90;animation:fade .15s ease}
.drw{position:fixed;top:10px;right:10px;bottom:10px;width:470px;max-width:calc(100vw - 20px);background:#fff;border-radius:14px;box-shadow:var(--sh64);z-index:91;display:flex;flex-direction:column;overflow:hidden;animation:slide .22s cubic-bezier(.1,.9,.2,1)}
.drw-h{display:flex;align-items:center;gap:10px;padding:18px 16px 14px 24px;border-bottom:1px solid var(--st3)}
.drw-h h3{font-size:17px;font-weight:700;flex:1}
.drw-b{flex:1;overflow:auto;padding:18px 24px 26px}
.drw-f{display:flex;gap:8px;padding:14px 24px;border-top:1px solid var(--st3);background:var(--bg2)}
pre.json{margin:0;padding:12px 14px;background:#2b2220;color:#f3ebe9;border-radius:10px;font-family:var(--mono);font-size:11.5px;line-height:1.55;overflow:auto;white-space:pre-wrap;word-break:break-all}

.toast{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--st);border-radius:12px;box-shadow:var(--sh16);padding:12px 12px 12px 14px;animation:tin .24s cubic-bezier(.1,.9,.2,1)}

.tri-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.invsum .tot b{font-weight:700}
.attach{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--st2);border-radius:999px;background:#fff;font-size:12.5px;font-weight:600}

.mail{overflow:hidden}

@media (max-width:1360px){.d2{grid-template-columns:minmax(0,1fr) 292px}.split{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}}
@media (max-width:1100px){

  .narrow-only{display:inline-grid}.d2{grid-template-columns:minmax(0,1fr)}

}

  .snap{grid-template-columns:1fr 1fr}

  .c3{grid-template-columns:1fr 1fr}
  .kpis{gap:12px}.kpi{padding:14px 16px}
}
@media (max-width:1024px){
  .app{--navw:56px}
  .app .nav{padding:14px 8px 10px}
  .app .nav-i span,.app .nav-i .c,.app .nav-foot span{display:none}
  .app .nav-i{padding:0;justify-content:center}
  .d-cols,.dgrid,.pcard,.c3{grid-template-columns:minmax(0,1fr)}
  .pcard>div+div{border-left:0;border-top:1px solid var(--st3);border-radius:0 0 12px 12px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .profile div,.brand .wm{display:none}
  .profile{border-left:0;padding-left:4px}
  .page{padding:20px 16px 36px}
  .pv{grid-template-columns:1fr}.pv div:nth-child(odd){border-right:0}.pv div:nth-last-child(2){border-bottom:1px solid var(--st3)}

@media (max-width:640px){
  .kpis{grid-template-columns:1fr 1fr}
  .snap{grid-template-columns:1fr}.snap>section{border-right:0;border-bottom:1px solid var(--st3)}.snap>section:last-child{grid-column:auto}
  .brand span,.brand i{display:none}
  .mailbody{padding-left:18px}
  .tl li{grid-template-columns:64px 22px minmax(0,1fr)}.tl li::before{left:86px}
  /* 좁은 화면의 할 일: 꼬리표·상태 한 줄, 제목·열기 한 줄 / narrow to-do rows: tag and status, then title and open */
  .todo{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .todo>.bdg{grid-area:1/1}.todo>.stt{grid-area:1/2}.todo>.tx{grid-area:2/1}.todo>.btn{grid-area:2/2}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

   EN display adjustment: English step labels are longer, so they may wrap and share width by content */
html[lang="en"] .pstep{flex:1 1 auto;white-space:normal;line-height:1.25}

  /* 괄호 밖의 구분자에서만 나눈다('수량 변경 감지 (500EA → 1,000EA)'의 화살표는 괄호 안이라 나누지 않음)
     split only on separators outside brackets (the arrow in '수량 변경 감지 (500EA → 1,000EA)' is inside, so it stays) */
  function splitTop(t, sep) {
    const out = []; let depth = 0, last = 0;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (c === '(') depth++; else if (c === ')') depth = Math.max(0, depth - 1);
      else if (!depth && t.startsWith(sep, i)) { out.push(t.slice(last, i)); last = i + sep.length; i += sep.length - 1; }
    }
    out.push(t.slice(last));
    return out;
  }

  /* ---------- 날짜·통화 인라인 변환 / inline date and currency ---------- */
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const WDEN = { '일': 'Sun', '월': 'Mon', '화': 'Tue', '수': 'Wed', '목': 'Thu', '금': 'Fri', '토': 'Sat' };
  function inline(t) {
    return t
      .replace(/(\d{4})년 (\d{1,2})월 (\d{1,2})일 \(([일월화수목금토])\) (오전|오후) (\d{1,2}):(\d{2})/g, (x, y, mo, d, w, ap, h, mi) => `${WDEN[w]}, ${MON[mo - 1]} ${+d}, ${y}, ${h}:${mi} ${ap === '오전' ? 'AM' : 'PM'}`)
      .replace(/(\d{1,2})월 (\d{1,2})일 \(([일월화수목금토])\)/g, (x, mo, d, w) => `${WDEN[w]}, ${MON[mo - 1]} ${+d}`)
      .replace(/(\d{1,2})월 (\d{1,2})일/g, (x, mo, d) => `${MON[mo - 1]} ${+d}`)
      .replace(/^오늘 · /, 'Today · ').replace(/^어제 · /, 'Yesterday · ')
      .replace(/(\d[\d,]*)원/g, 'KRW $1');

     자리 순서는 한국어 원문 순서이고, 영어 값에서는 같은 토큰(월·일은 'Oct 15' 형태)을 찾아 자리로 바꾼다.
     The server moves seed dates to its today (10월 15일 → 10월 23일, 10/15 → 10/23, SO-20260915-… → SO-20260923-…). Entries
     holding dates or order numbers are registered once more under a key whose tokens become {0}, {1}…, so shifted values get
     the same translation. Slots follow the Korean order; in the English value the same token ('Oct 15' for a month-day) is
     located and turned into its slot. */
  const TOKRE = /SO-\d{8}-\d{5}|INV-\d{8}-\d{5}|\d{4}-\d{2}-\d{2}|\d{1,2}월 \d{1,2}일|(?<![\d/])\d{1,2}\/\d{1,2}(?![\d/])/g;
  const tokEn = k => { const m = /^(\d{1,2})월 (\d{1,2})일$/.exec(k); return m ? `${MON[m[1] - 1]} ${+m[2]}` : k; };

    }

  /* 앞뒤 공백을 뗀 핵심 문자열 번역(재귀) / translate a trimmed core string (recursive) */

    if (m[1] || m[3]) return (m[1] || '') + T(m[2]) + (m[3] || '');
    for (const [re, fn] of RA) { const r = re.exec(t); if (r) { const o = fn(r); if (o !== undefined) return o; } }
    const ss = t.split(/(?<=[다요]\.)\s+(?=\S)/);
    if (ss.length > 1) return ss.map(T).join(' ');
    for (const [sep, join] of SEPS) {
      if (!t.includes(sep)) continue;
      const parts = splitTop(t, sep); if (parts.length < 2) continue;
      const out = parts.map(p => T(p.trim()));
      if (out.some((x, i) => x !== parts[i].trim())) return out.join(join);

  }

    'script', 'style', 'textarea', '.avatar',
    '.mbody', '.msig', 'blockquote',                                                   /* 메일 본문·서명·인용 / mail body, signature, quotes */
    '.row[data-act="sel"] .r2', '.dh h2', '.mh-m dd:last-child', '.th-2', '.todo .tx b',  /* 메일 제목 / mail subjects */
    '#gpop .pop-item[data-act="go-mail"] .t', '#notifPop .s', '.m-kv b',
    '#modalRoot .invdoc'                                                               /* 고객 발주서 / the customer's purchase order */
  ].join(',');
  /* 데이터 요소 안의 시스템 조각만 번역: 대시보드 '고객사 · 제목' 은 고객사 쪽(예: '누리 (고객 미확정)')만

      ORIG.set(n, { ko: v, en: o }); n.nodeValue = o;

    for (const el of elems(root)) {

    cur = l === 'en' ? 'en' : 'ko';

    document.title = cur === 'en' ? 'M Cosmetic Email Agent' : 'M코스메틱 Email Agent';
    apply(document.body);
  }

  /* ---------- 연결: 앱 함수 감싸기 + 안전망 / hookup: wrap app functions + safety net ---------- */
  const WRAP = ['render', 'renderNav', 'renderHeader', 'refreshParts', 'renderDrawer', 'openModal', 'toast', 'renderNotif', 'renderSearch'];
  let depth = 0, installed = false;
  function wrap(name) {
    const f = window[name]; if (typeof f !== 'function') return;
    window[name] = function () {
      depth++;
      try { return f.apply(this, arguments); }
      finally { if (--depth === 0 && cur === 'en') toEn(document.body); }   /* 쓰기 직후 같은 작업 안에서 번역 → 한국어가 그려질 틈이 없다 / translated in the same task right after the write, so Korean never paints */
    };
  }
  function install() {
    if (installed) return; installed = true;
    WRAP.forEach(wrap);
    /* 놓친 경로 안전망: 추가된 노드만, 마이크로태스크 시점(그리기 전)에 처리. 번역은 문자 데이터·속성만 바꾸므로 되먹임 없음
       Safety net for missed paths: only added nodes, at the microtask checkpoint (before paint); translation only changes
       character data and attributes, so it never feeds back into this childList observer */
    new MutationObserver(recs => { if (cur !== 'en') return; for (const r of recs) for (const n of r.addedNodes) if (n.isConnected) toEn(n); })
      .observe(document.body, { childList: true, subtree: true });
  }

  window.addEventListener('storage', ev => { if (ev.key === KEY || ev.key === null) { const l = read(); if (l !== cur) setLang(l); } });
  setLang(cur);   /* 정적 헤더(검색창 안내문·프로필 팀명 등)를 첫 그리기 전에 맞춘다 / fix the static header before the first paint */

  return {
    get lang() { return cur; }, KEY, pairs: PAIRS, dict: DICT, rev: REV, ctx: CTX, rules: RA.concat(RB), SKIP,
    tok: { dict: TDICT, conflicts: TCONF, skipped: TSKIP },
    tr: (s, el) => tr(s, el), back: s => REV.get(s), apply, setLang, install
  };
})();
window.I18N = I18N;

function curMail() { const v = S.view; if (v === 'errors') { const x = DATA.errById[S.sel.errors]; return x ? getMail(x.emailId) : null; } return MAIL_VIEWS.includes(v) ? getMail(S.sel[v]) : null; }
/* 뷰·선택을 바꾸면 캐시로 바로 그린 뒤 서버에서 다시 받는다. 화면과 S(액션 대상)가 어긋나는 틈을 두지 않는다

/* =====================================================================
   액션: 엔드포인트 호출 → 응답 {email, case, errors, log, toast, nav} 병합 → 다시 그리기 → 토스트.
   실패(422·404)는 '처리하지 못했습니다' 토스트와 함께 현재 서버 상태로 다시 맞춘다.
   Actions: call the endpoint → merge {email, case, errors, log, toast, nav} → re-render → toast.
   A failure (422 or 404) shows the 'could not process' toast and re-syncs with the current server state.
   ===================================================================== */
const MIN_BUSY = { erp: 700, order: 900, send: 700, draft: 450 };   /* 진행 표시 최소 시간(ms) / minimum progress display (ms) */
function mergeAction(res) {
  ++SEQ.main;   /* 이 응답보다 먼저 나간 조회는 버린다 / drop reads sent before this reply */
  if (!res) return;
  if (res.email) putMail(res.email);
  if (res.case) putCase(res.case);
  if (res.errors) { DATA.errors = res.errors; putErrors(res.errors); }
  if (res.log) DATA.log = res.log;
  if (res.nav) DATA.nav = res.nav;
  reapplyEdit();
}
async function runAction(id, kind, path, body, then) {
  /* 메일별로 한 번에 하나, 메일 없는 액션(시나리오·초기화·Case 담당자)은 '*' 로 하나씩 / one at a time per mail; id-less actions share '*' */
  const key = id || '*'; if (S.busy[key]) return null; S.busy[key] = kind || 'op';
  await flushEdits();
  if (id && kind) render();
  const t0 = Date.now(); let res = null, fail = null;
  try { res = await api('POST', path, body); } catch (err) { fail = err; }
  const wait = (MIN_BUSY[kind] || 0) - (Date.now() - t0); if (wait > 0) await sleep(wait);
  delete S.busy[key];
  if (fail) { await reload({ quiet: true }); toast('error', '처리하지 못했습니다', fail.message); return null; }
  mergeAction(res);
  if (res.toast) toast(res.toast.type, res.toast.title, res.toast.msg);
  try { if (then) await then(res); else await reload(); } catch (err) { toast('error', '처리하지 못했습니다', err.message); }
  return res;
}
const mailAct = (path, body, then) => { const e = curMail(); if (!e) return null; return runAction(e.emailId, null, `/mails/${enc(e.emailId)}/${path}`, body, then); };
/* 초안이 새로 생기면 다시 그린 뒤 타이핑 연출 / when a new draft arrives, re-render and play the typing effect */
async function afterDraft(res, before, meta) {
  const e = res.email, now = e ? e.flow.draft || '' : '';
  if (e && (now !== before || e.flow.mail === 'sent')) delete S.draftEdit[e.emailId];
  await reload({ meta: !!meta });
  const cur = curMail();
  if (e && now && now !== before && e.flow.mail !== 'sent' && cur && cur.emailId === e.emailId) { typeDraft(now); const rc = $('#replyCard'); rc && rc.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' }); }
}
function runErp(e) { if (!e) return null; const before = e.flow.draft || ''; return runAction(e.emailId, 'erp', `/mails/${enc(e.emailId)}/erp`, { lang: curLang() }, r => afterDraft(r, before)); }
function runOrder(e) { if (!e) return null; return runAction(e.emailId, 'order', `/mails/${enc(e.emailId)}/order`, undefined, () => reload({ meta: true })); }
function runDraft(e, regen) { if (!e) return null; const before = e.flow.draft || ''; return runAction(e.emailId, 'draft', `/mails/${enc(e.emailId)}/draft`, { regen: !!regen, lang: curLang() }, r => afterDraft(r, before)); }
function runSend(e) { if (!e) return null; const id = e.emailId; return runAction(id, 'send', `/mails/${enc(id)}/send`, { draft: draftText(e) }, async () => { delete S.draftEdit[id]; await reload(); }); }
function saveDraft(e) { if (!e) return null; const id = e.emailId; return runAction(id, null, `/mails/${enc(id)}/draft-save`, { draft: draftText(e) }, () => { delete S.draftEdit[id]; refreshParts(); }); }
/* 하단 실행 바의 '다시 시도': 실패한 작업을 그 메일에서 바로 다시 부른다 / the CTA retry calls the failed step on the mail itself */
function runRetry(e) { if (!e) return null; const k = apiErr(e); return k === 'erp' ? runErp(e) : k === 'order' ? runOrder(e) : k === 'mail' ? runSend(e) : null; }
/* 처리오류 목록의 재처리: /errors/{id}/retry / retry from the processing-error list */
const ERR_KIND = { 'ERP 조회 실패': 'erp', 'ERP 주문등록 실패': 'order', 'Email 발송 실패': 'send' };
function retryError(x) {
  if (!x) return null; const e = getMail(x.emailId), before = e ? e.flow.draft || '' : '';
  return runAction(x.emailId, ERR_KIND[x.category] || 'op', `/errors/${enc(x.id)}/retry`, { lang: curLang() }, r => afterDraft(r, before, true));
}
function typeDraft(full) {
  const ta = $('#draftTa'); if (!ta || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  let i = 0; const step = Math.max(4, Math.ceil(full.length / 28)); ta.value = ''; TRACK.n++;
  const iv = setInterval(() => { const el = $('#draftTa'); if (!el || el !== ta) { clearInterval(iv); TRACK.n--; return; } i += step; el.value = full.slice(0, i); if (i >= full.length) { el.value = full; clearInterval(iv); TRACK.n--; } }, 22);
}
/* 추출 데이터 직접 수정: 입력은 바로 화면에, 서버에는 잠시 뒤(또는 다른 액션 전에) 보낸다
   Direct entity edits: shown at once, sent to the server shortly after (or before any other action) */
function queueEdit(id, field, value) {
  if (EDIT.pend && (EDIT.pend.id !== id || EDIT.pend.field !== field)) flushEdits();

}
function flushEdits() {

  catch (err) { toast('error', '처리하지 못했습니다', err.message); await reloadNow({ quiet: true }); return; }   /* 수정 체인 안이라 reload(→flushEdits) 대신 / inside the edit chain, so not reload (it would await itself) */

  sec.querySelectorAll('.ef input[data-k]').forEach(inp => { const k = inp.dataset.k, f = e.entities[k]; if (!f) return; const bad = issues(e).some(i => i.field === k), row = inp.closest('.ef'); row.classList.toggle('low', bad); row.querySelector('.src').outerHTML = srcTag(f, bad); });

}

function detail(e) {
  return `<div class="dp-scroll" data-key="${e.emailId}"><div class="dp-in">
    <div class="card"><div class="dh" id="dh">${dhead(e)}</div>${e.ai ? `<div class="aisum">${ic('sparkle')}<p>${esc(aiText(e))}</p>${confCell(e.confidence)}</div>` : ''}</div>
    <div id="triage">${triage(e)}</div>
    <div class="d2"><div class="d-left">${mailCard(e)}${threadCard(e)}<div id="tasks" class="d-left">${tasks(e)}</div></div><aside class="ai" id="info" aria-label="AI 분석 결과">${info(e)}</aside></div></div></div>
    <div class="cta" id="cta">${ctaBar(e)}</div>`;
}
function dhead(e) {
  const live = !e.closed && !isBusy(e);
  return `<button class="icb narrow-only" data-act="back-list" aria-label="목록으로">${ic('back')}</button><div class="dh-main"><div class="dh-tags">${clsBadge(e.classification)}${e.intent ? `<span class="chip">${esc(e.intent)}</span>` : ''}${statusBadge(e, 1)}${e.workStatus && !e.closed ? `<span class="muted" style="font-size:12px">${esc(e.workStatus)}</span>` : ''}</div><h2>${esc(e.subject)}</h2><div class="dh-from"><b>${esc(e.customer)}</b> · ${esc(e.senderName)} · ${fmtTime(e.receivedDate)} 수신</div></div>
    <div class="dh-r"><button class="btn btn-sm" data-act="assign-cur" title="담당자 지정">${ic('user', 'sm')}${esc(e.assignee || '담당자 없음')}</button><button class="icb" data-act="more" aria-label="더보기" aria-expanded="${S.menu}">${ic('more', 'lg')}</button>
      ${S.menu ? `<div class="menu" role="menu"><button data-act="reclass" ${live ? '' : 'disabled'}>${ic('swap')}분류 변경</button><button data-act="link-case" ${live && e.classification && e.classification !== 'etc' ? '' : 'disabled'}>${ic('link')}Case 연결 변경</button><button data-act="assign-cur">${ic('user')}담당자 지정</button><button data-act="hold" ${live && !inTriage(e) ? '' : 'disabled'}>${ic('pause')}${e.hold ? '보류 해제' : '보류'}</button><button data-act="complete" ${live ? '' : 'disabled'}>${ic('check')}완료처리</button></div>` : ''}</div>`;
}

/* ---------- 메일 원문 : 실제 메일 클라이언트처럼 ---------- */
const FILE_TONE = { pdf: ['PDF', '#c4314b'], xlsx: ['XLS', '#107c41'], jpg: ['IMG', '#8764b8'], png: ['IMG', '#8764b8'], docx: ['DOC', '#0f6cbd'] };
const attList = m => m.attachments || (m.attach ? [{ name: m.attach, size: '86KB', type: 'inv' }] : []);
function attChips(m) { const l = attList(m); if (!l.length) return ''; return `<div class="matt"><div class="matt-h">${ic('clip', 'sm')}첨부파일 ${l.length}개${l.some(a => a.type === 'po') ? '<span>AI가 첨부 내용도 함께 분석했습니다</span>' : ''}</div>${l.map((a, i) => { const x = a.name.split('.').pop().toLowerCase(), t = FILE_TONE[x] || ['FILE', '#616161']; return `<button class="file" data-act="view-att" data-id="${m.emailId}" data-i="${i}"><i style="background:${t[1]}">${t[0]}</i><span><b>${esc(a.name)}</b><small>${a.size}</small></span></button>`; }).join('')}</div>`; }
function sigBlock(m) {
  if (m.direction === 'out') { const u = USERS.find(u => u.name === m.senderName); return `<div class="msig"><img src="${LOGO_FULL}" alt="" style="width:74px;float:right;opacity:.9"><b>${esc(m.senderName)}</b> ${u ? esc(u.team) : ''}<br>${MC_SIG.company}<br>Tel ${MC_SIG.tel} · ${MC_SIG.mail}<br>${MC_SIG.addr}<br>${MC_SIG.web}</div>`; }
  const x = SIGX[m.customer], ct = CONTACTS[m.customer];
  if (!x) return m.customer === '누리 (고객 미확정)' || m.senderName === '배성민' ? `<div class="msig"><b>배성민</b> 누리 구매팀<br>Mobile 010-5521-0936</div>` : '';
  return `<div class="msig"><b>${esc(m.senderName)}</b> ${x[1]}<br>${x[0]}<br>Tel ${x[2]} · Mobile ${x[3]}<br>${esc(m.sender)}${ct?.addr ? '<br>' + esc(ct.addr) : ''}</div>`;
}
function quoteBlock(m) {
  if (!/^re:/i.test(m.subject) || !m.caseId) return ''; const prev = caseMails(m.caseId).filter(p => p.receivedDate < m.receivedDate).pop(); if (!prev) return '';
  return `<details class="quote"><summary title="이전 메시지 인용 보기">•••</summary><div><p>${fullDate(prev.receivedDate)}, ${esc(prev.senderName)} &lt;${esc(prev.sender)}&gt; 작성:</p><blockquote>${esc(prev.body)}</blockquote></div></details>`;
}
const msgInner = m => `<div class="mbody">${esc(m.body)}</div>${quoteBlock(m)}${sigBlock(m)}${attChips(m)}`;
function mailCard(e) {
  return `<article class="card mail" aria-label="메일 원문"><header class="mh"><div class="avatar" style="width:38px;height:38px;font-size:14px">${esc((e.senderName || '?')[0])}</div>
    <div class="mh-m"><div class="mh-from"><b>${esc(e.senderName)}</b> <span>&lt;${esc(e.sender)}&gt;</span></div><dl><dt>받는 사람</dt><dd>M코스메틱 영업 &lt;${esc(e.recipient)}&gt;</dd>${e.cc ? `<dt>참조</dt><dd>${esc(e.cc)}</dd>` : ''}<dt>제목</dt><dd>${esc(e.subject)}</dd></dl></div>
    <div class="mh-r"><time>${fullDate(e.receivedDate)}</time><div>${attList(e).length ? ic('clip', 'sm') : ''}<span class="mono">${e.emailId}</span></div></div></header>${msgInner(e)}</article>`;
}
function threadCard(e) {
  if (!e.caseId) return ''; const l = caseMails(e.caseId).filter(m => m.emailId !== e.emailId).reverse(); if (!l.length) return '';
  return `<section class="card thread" aria-label="주고받은 메일"><div class="card-h" style="min-height:42px;padding:9px 16px">${ic('mail')}<h3>주고받은 메일</h3><span class="sub">같은 Case의 메일 ${l.length}통 · 누르면 본문이 펼쳐집니다</span><span class="sp"></span><button class="link" data-act="view-case" data-id="${e.caseId}">Case 이력 전체</button></div>
    ${l.map(m => { const out = m.direction === 'out', after = m.receivedDate > e.receivedDate; return `<details class="th"><summary><span class="avatar ${out ? 'me' : ''}">${out ? 'M' : esc((m.senderName || '?')[0])}</span><span class="th-m"><span class="th-1"><b>${esc(out ? m.senderName + ' (M코스메틱)' : m.senderName)}</b><span class="dir ${m.direction}">${out ? '보낸 메일' : '받은 메일'}</span>${after ? '<span class="chip sm">이 메일 이후</span>' : ''}${attList(m).length ? ic('clip', 'sm') : ''}</span><span class="th-2"><span class="th-s">${esc(m.subject)}</span> <span class="th-p">${esc(String(m.body || '').replace(/\s+/g, ' ').slice(0, 70))}</span></span></span><time>${fmtTime(m.receivedDate)}</time></summary>
      <div class="th-b"><dl class="th-meta"><dt>보낸 사람</dt><dd>${esc(m.senderName)} &lt;${esc(m.sender)}&gt;</dd><dt>받는 사람</dt><dd>${esc(m.recipient)}</dd><dt>날짜</dt><dd>${fullDate(m.receivedDate)}</dd></dl>${msgInner(m)}${!out && !m.closed ? `<button class="btn btn-sm" style="margin:0 16px 14px" data-act="go-mail" data-id="${m.emailId}">이 메일 처리하기${ic('arrowR', 'sm')}</button>` : ''}</div></details>`; }).join('')}</section>`;
}

/* ---------- 확인 필요 (수신메일에서 해결) ---------- */
function triage(e) {
  const iss = issues(e); if (!iss.length) return '';
  const dest = e.classification && CLS[e.classification] ? `${CLS[e.classification].label} 메뉴에서 바로 처리할 수 있습니다` : '필요한 항목을 안내합니다';
  return `<div class="tri"><div class="tri-h">${ic('error')}확인이 필요한 항목 ${iss.length}건<span>모두 확인하면 ${dest}.</span></div>${iss.map((it, i) => `<div class="tri-i"><div class="tri-n">${i + 1}</div><div>${triItem(e, it)}</div></div>`).join('')}</div>`;
}
function triItem(e, it) {
  if (it.k === 'class') return `<b class="q">어떤 업무의 메일인가요?</b><p>${esc(e.reason)}</p><div class="opts">${Object.keys(CLS).map(k => { const g = (e.guess || []).find(x => x[0] === k); return `<button class="opt" data-act="tri-class" data-k="${k}">${clsBadge(k)}<small style="margin-top:6px">${g ? `AI 추정 ${g[1]}%` : '　'}</small></button>`; }).join('')}</div>`;
  if (it.k === 'case') {
    const cands = (e.candidates || allCases().filter(c => c.customerCode && c.customerCode === e.entities.customerCode?.value).map(c => c.caseId)).map(getCase).filter(Boolean);
    return `<b class="q">어느 업무 Case의 메일인가요?</b><p>${e.candidates ? esc(e.reason) : '연결된 Case가 없습니다. 기존 Case를 선택하거나 새 Case로 시작해 주세요.'}</p><div class="opts">${cands.map(c => `<button class="opt" data-act="tri-case" data-id="${c.caseId}"><b class="mono">${c.caseId}</b><small>${esc(c.entity.itemName)} / ${Number(c.entity.quantity).toLocaleString()}EA · 납기 ${c.entity.deliveryDate}</small><small>${esc(c.status)} · ${esc(c.request)}</small></button>`).join('')}<button class="opt new" data-act="tri-newcase"><b>새 Case로 시작</b><small>기존 업무와 관련 없는 새 요청입니다</small></button></div>`;
  }
  const k = it.field, f = e.entities[k], label = FIELDS[k], picks = e.pick?.[k];
  const q = k === 'customerCode' ? '어느 고객사인가요?' : k === 'itemCode' ? '어떤 품목인가요?' : k === 'salesOrder' ? '어느 주문(Sales Order)인가요?' : it.missing ? `${label} 값을 입력해 주세요` : `${label} 값이 맞는지 확인해 주세요`;
  const why = picks ? esc(e.reason) : it.missing ? `메일에서 ${label} 값을 찾지 못했습니다. ${CLS[e.classification].label} 처리에 꼭 필요한 값입니다.` : `AI 신뢰도가 ${Math.round((f ? f.conf : 0) * 100)}%로 낮습니다. 값을 수정하거나 그대로 확인해 주세요.`;
  if (picks) return `<b class="q">${q}</b><p>${why}</p><div class="opts">${picks.map(c => `<button class="opt" data-act="tri-pick" data-k="${k}" data-v="${c.value}"><b>${k === 'salesOrder' ? `<span class="mono">${c.value}</span>` : esc(c.label)}</b><small class="${k === 'salesOrder' ? '' : 'mono'}">${k === 'salesOrder' ? esc(c.label) : c.value}</small><small>${esc(c.note)}</small></button>`).join('')}</div>`;
  const master = k === 'customerCode' ? Object.entries(ERP_CUSTOMERS).map(([c, n]) => [c, n]) : k === 'itemCode' ? Object.entries(ERP_ITEMS).map(([c, v]) => [c, v.short]) : k === 'salesOrder' ? Object.values(SHIPMENTS).filter(o => !e.entities.customerCode?.value || o.customerCode === e.entities.customerCode.value).map(o => [o.so, `${o.item} ${Number(o.orderQty).toLocaleString()}EA · ${o.state}`]) : null;
  return `<b class="q">${q}</b><p>${why}</p><div class="tri-in">${master ? `<select id="tri-${k}" aria-label="${label}"><option value="">선택해 주세요</option>${master.map(([c, n]) => `<option value="${c}">${esc(n)} (${c})</option>`).join('')}</select>` : `<input id="tri-${k}" value="${esc(f?.value || '')}" placeholder="${k === 'deliveryDate' ? 'YYYY-MM-DD' : label}" aria-label="${label}">`}<button class="btn btn-p" data-act="tri-set" data-k="${k}">${ic('check')}확인</button></div>`;
}

/* ---------- AI 분석 결과 (추출 데이터 · Delta · Case) ---------- */
const SRC = { ai: ['sparkle', '메일에서 AI 추출'], master: ['db', 'ERP 마스터 매칭'], case: ['link', '기존 Case'], user: ['user', '담당자 확인'] };
function srcTag(f, bad) { const s = SRC[f.src] || SRC.ai; return `<span class="src ${bad ? 'low' : f.src}" title="${s[1]}${f.src !== 'user' ? ' · 신뢰도 ' + Math.round(f.conf * 100) + '%' : ''}">${ic(bad ? 'error' : s[0], 'sm')}</span>`; }
function info(e) {
  const c = getCase(e.caseId), set = FIELDSETS[e.classification] || (e.classification ? [] : ['customer', 'customerCode']), req = REQUIRED[e.classification] || [];
  const bad = k => issues(e).some(i => i.field === k);
  return `<div class="ai-h">${ic('sparkle')}<h3>AI 분석 결과</h3></div>
    ${e.classification === 'etc' ? `<div class="ai-s"><h4>AI 판단</h4><p class="reason">${esc(e.reason)}</p></div>` : `
    <div class="ai-s"><h4>연결된 업무 Case</h4>${c ? `<button class="case-mini" data-act="view-case" data-id="${c.caseId}">${ic('case', 'lg')}<div style="flex:1;min-width:0"><b class="mono">${c.caseId}</b><small>${esc(c.status)}${c.entity.unitPrice ? ' · 제시단가 ' + won(c.entity.unitPrice) : ''}</small></div><span class="muted" style="font-size:12px;white-space:nowrap">이력 보기</span></button>` : `<p class="muted">${CASE_OPTIONAL.includes(e.classification) ? '연결된 Case 없이 처리하는 단순 문의입니다.' : '아직 연결되지 않았습니다.'}</p>`}</div>
    ${e.delta ? `<div class="ai-s"><h4>이번 메일에서 바뀐 내용</h4><div class="dcap"><span></span><span>Before</span><span></span><span>After</span></div>${e.delta.changed.map(d => `<div class="delta"><label>${esc(d.label)}</label><div class="bf">${esc(d.prev)}</div>${ic('arrowR')}<div class="af">${esc(d.cur)}</div></div>`).join('')}<div class="kept">그대로 ${e.delta.kept.map(k => `<span class="chip">${esc(k.label)} ${esc(k.value)}</span>`).join('')}</div></div>` : ''}
    <div class="ai-s" id="entSec"><h4>추출 데이터<span class="note">직접 수정 가능</span></h4>${set.filter(k => e.entities[k]).map(k => { const fl = e.entities[k], b = bad(k); return `<div class="ef ${b ? 'low' : ''}"><label for="ef-${k}">${FIELDS[k]}${req.includes(k) ? '<span class="req" title="필수">*</span>' : ''}</label><input id="ef-${k}" data-in="ent" data-k="${k}" value="${esc(fl.value)}" ${e.closed ? 'readonly' : ''} ${/Code|salesOrder|quoteRef/.test(k) ? 'class="mono"' : ''}>${srcTag(fl, b)}</div>`; }).join('')}
      <div class="srclegend"><span>${ic('sparkle', 'sm')}AI 추출</span><span>${ic('db', 'sm')}ERP 매칭</span><span>${ic('link', 'sm')}Case</span><span>${ic('user', 'sm')}담당자</span><span><span class="req">*</span> 필수</span></div></div>
    ${e.reason ? `<div class="ai-s"><h4>AI 판단 근거</h4><p class="reason">${esc(e.reason)}</p></div>` : ''}`}`;
}

/* ---------- 업무 처리 영역 ---------- */
function stepBar(e) {
  const st = workSteps(e); if (!st.length) return ''; const cur = e.closed ? -1 : st.findIndex(s => !s[1]);
  return `<div class="steps" aria-label="처리 단계">${st.map((s, i) => `<div class="pstep ${s[1] ? 'done' : i === cur ? 'cur' : ''}"><i>${s[1] ? ic('check') : i + 1}</i><span>${s[0]}</span></div>`).join('')}</div>`;
}
/* ERP 조회 카드의 표시 상태: 진행 중이면 loading / display state of an ERP card; loading while in flight */
const erpState = e => busyOp(e) === 'erp' ? 'loading' : e.flow.erp;
const staleMsg = e => e.flow.erpStale && !e.closed ? `<div class="msg warn" style="margin-top:8px">${ic('error')}<div><b>조회 후 데이터가 수정되었습니다</b><p>수정한 값으로 다시 조회해 주세요.</p></div><button class="btn btn-sm" data-act="erp">다시 조회</button></div>` : '';
function priceCard(e) {
  const f = e.flow, en = e.entities, st = erpState(e), cc = en.customerCode?.value || '', q = en.quantity?.value || '';
  let body;
  if (st === 'loading') body = loadbox(e.delta ? 'ERP 단가 재조회 중...' : 'ERP 단가 조회 중...', 'GET /api/erp/v1/prices');
  else if (st === 'done') { const r = f.erpResult, req = en.deliveryDate?.value, ok = !req || r.lead <= req;
    body = `<div class="card-b"><div class="kvt"><div><span>품목</span><b>${esc(r.itemName)}</b></div><div><span>기준단가</span><b class="num">${won(r.base)}</b></div><div><span>${Number(r.qty).toLocaleString()}EA 적용단가 (Customer Price)</span><b class="num" style="color:var(--brand-p);font-size:16px">${won(r.price)}${r.rate ? ` <small class="muted" style="font-weight:400;font-size:12px">-${Math.round(r.rate * 100)}%</small>` : ''}</b></div><div><span>재고 (Stock)</span><b class="num">${Number(r.stock).toLocaleString()} EA</b></div><div><span>예상납기 (Estimated Delivery)</span><b class="num">${r.lead}</b></div><div><span>요청 납기</span><b class="num">${esc(req || '-')}</b></div></div>
      <div class="msg ${ok ? 'ok' : 'warn'}" style="margin-top:14px">${ic(ok ? 'check' : 'error')}<div><b>${!req ? '요청 납기가 없어 예상 납기를 안내합니다' : ok ? '요청 납기 내 납품 가능' : '요청 납기 내 납품 어려움'}</b>${req ? `<p>${ok ? `예상 납기 ${r.lead} ≤ 요청 납기 ${req}` : `요청 수량이 재고 ${Number(r.stock).toLocaleString()}EA를 초과합니다. 최단 납기는 ${r.lead}입니다.`}</p>` : ''}</div></div>
      ${staleMsg(e)}</div>
      <div class="api">${esc(f.erpApi || `GET /api/erp/v1/prices?customer=${cc}&item=${r.itemCode}&qty=${r.qty}`)} → <span class="okc">200 OK</span> · ${f.erpMs || 900}ms</div>`; }
  else if (st === 'error') body = `<div class="card-b"><div class="msg err">${ic('error')}<div><b>ERP 조회 실패</b><p>${esc(f.erpError)}</p><p>추출 데이터를 확인한 뒤 다시 시도해 주세요. 처리오류 메뉴에도 기록되었습니다.</p></div></div></div><div class="api">GET /api/erp/v1/prices → <span class="erc">404 Not Found</span></div>`;
  else return '';
  return `<div class="card"><div class="card-h">${ic('db')}<h3>ERP 단가 조회 결과</h3><span class="sp"></span>${st === 'done' && !e.closed ? `<button class="btn btn-sm btn-sub" data-act="erp">${ic('refresh', 'sm')}다시 조회</button>` : ''}</div><div class="cond"><span>Customer Code<b>${esc(cc)}</b></span><span>Item Code<b>${esc(en.itemCode?.value || '')}</b></span><span>Quantity<b>${esc(q)}</b></span></div>${body}</div>`;
}
function shipCard(e) {
  const f = e.flow, en = e.entities, st = erpState(e), r = f.erpResult, conds = ['Sales Order Number', 'Customer Code + Item Code', 'Customer Code + 최근 주문', '기존 Case와 연결된 주문'];
  let body;
  if (st === 'loading') body = loadbox('ERP 출하내역 조회 중...', 'GET /api/erp/v1/shipments');
